name: Merged PR performance

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  performance:
    if: >-
      github.repository == 'microsoft/opentelemetry-distro-browser' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.full_name == 'microsoft/opentelemetry-distro-browser' &&
      github.event.pull_request.merge_commit_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.22.1 <25"
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm run test:install-browsers -- --with-deps

      - name: Test performance result schema and export safeguards
        run: npm run test:perf

      - name: Build exact production artifacts
        run: npm run build && npm run size

      - name: Measure build, CDN, and browser performance without exporting workload telemetry
        id: measure
        run: npm run perf -- --cdn

      - name: Publish measured performance results
        env:
          # Fork-origin PR runs cannot read upstream Actions variables.
          SDK_PERF_COLLECTOR_ENDPOINT: https://perftest-collector-tst.jollyfield-f95f40a3.westus2.azurecontainerapps.io/otlp/v1/logs
          BENCHMARK_RUN_ID: ${{ steps.measure.outputs.run-id }}
        run: npm run perf:export -- --input "artifacts/performance/$BENCHMARK_RUN_ID" --endpoint "$SDK_PERF_COLLECTOR_ENDPOINT"
